<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>E-rieltor | Elon Berish</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #f7f7f8 60%);
    color: #1a1a1a;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  .emoji { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #555; line-height: 1.5; margin: 0 0 24px; font-size: 15px; }
  a.cta {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
    transition: background .15s ease;
  }
  a.cta:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🏡</div>
    <h1>E-rieltor | Elon Berish</h1>
    <p>Ko'chmas mulk e'loningizni joylashtirish uchun Telegram botimizdan foydalaning. Bir necha bosqichda ma'lumotlarni to'ldirasiz va murojaatingiz qabul qilinadi.</p>
    <a class="cta" href="https://t.me/add_ad_bot" target="_blank" rel="noopener">Botni ochish →</a>
  </div>
</body>
</html>
